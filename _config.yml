# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: Ranga Reddy
tagline: Apache Hudi, Iceberg and Spark internals
brief-intro: Senior Data Engineer
description: >-
  Hands-on notes, production troubleshooting and interactive tools for Apache
  Hudi, Iceberg, Spark, Kafka and the lakehouse stack underneath them.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://rangareddy.github.io" # the base hostname & protocol for your site

author: Ranga Reddy
avatar: https://avatars.githubusercontent.com/u/5094273?v=4
avatar_local: /assets/images/Ranga1.jpeg
timezone: Asia/Kolkata
lang: en

permalink: /:title/

# ---------------------------------------------------------------------------
# Social / contact
# ---------------------------------------------------------------------------
twitter_username: avula_ranga
facebook_username: rangareddy.avula
github_username: rangareddy
email: rangareddy.avula@gmail.com
linkedIn_username: rangareddy1988/
stackoverflow: users/1918962/ranga-reddy
cloudera_community: https://community.cloudera.com/t5/tkb/usercontributedarticlespage/user-id/78612/tkb-id/CommunityArticles
hudi_contributions: https://github.com/apache/hudi/graphs/contributors?all=1
resume: /assets/others/Ranga_Reddy_Data_Engineer.pdf

description_footer: You can contact me

# ---------------------------------------------------------------------------
# Comments (choose one, leave the other blank)
# ---------------------------------------------------------------------------
duoshuo_shortname:
disqus_shortname: rangareddy1988

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
markdown: kramdown

kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true
    default_lang: plaintext

markdown_ext: markdown,mkdown,mkdn,mkd,md

sass:
  style: compressed

# url
category_dir: category/
tag_dir: tag/

# excerpt
excerpt_separator: "\n\n\n\n"

# paginate
paginate: 6
paginate_path: "/blog/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-readme-index
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

# ---------------------------------------------------------------------------
# Front matter defaults
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Ranga Reddy

include:
  - _data

exclude:
  - _drafts
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
