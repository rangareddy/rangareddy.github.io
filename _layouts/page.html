---
layout: default
---

<div class="shell layout layout--with-rail">
  <article class="layout__main">
    <header class="page-head">
      <h1 class="page-head__title">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="page-head__lede">{{ page.description }}</p>
      {%- endif %}
    </header>
    <div class="prose" id="postBody">
      {{ content }}
    </div>
  </article>

  {% include sidebar.html toc=true show="profile,recent" %}
</div>
