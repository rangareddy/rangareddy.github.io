<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="fvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
    <filter id="fvGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#fvBg)"/>

  <text x="450" y="55" font-family="Inter, sans-serif" font-size="22"
        font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Iceberg format versions at 1.12.0
  </text>

  <line x1="80" y1="230" x2="820" y2="230" stroke="#14B8A6"
        stroke-width="2" opacity="0.5"/>

  <g filter="url(#fvGlow)">
    <circle cx="160" cy="230" r="16" fill="#4DD0E1"/>
    <circle cx="360" cy="230" r="16" fill="#4DD0E1"/>
    <circle cx="560" cy="230" r="16" fill="#4DD0E1"/>
  </g>
  <circle cx="760" cy="230" r="16" fill="none" stroke="#F87171"
          stroke-width="3" stroke-dasharray="4,4"/>

  <text x="160" y="275" font-family="Inter, sans-serif" font-size="18"
        fill="#FFFFFF" text-anchor="middle" font-weight="700">v1</text>
  <text x="160" y="300" font-family="Inter, sans-serif" font-size="11"
        fill="#E0F7FA" opacity="0.6" text-anchor="middle">legacy</text>
  <text x="160" y="145" font-family="Inter, sans-serif" font-size="13"
        fill="#4DD0E1" text-anchor="middle">data files only</text>

  <text x="360" y="275" font-family="Inter, sans-serif" font-size="18"
        fill="#FFFFFF" text-anchor="middle" font-weight="700">v2</text>
  <text x="360" y="300" font-family="Inter, sans-serif" font-size="11"
        fill="#F59E0B" opacity="0.9" text-anchor="middle">default for new tables</text>
  <text x="360" y="145" font-family="Inter, sans-serif" font-size="13"
        fill="#4DD0E1" text-anchor="middle">position + equality</text>
  <text x="360" y="165" font-family="Inter, sans-serif" font-size="13"
        fill="#4DD0E1" text-anchor="middle">deletes</text>

  <text x="560" y="275" font-family="Inter, sans-serif" font-size="18"
        fill="#FFFFFF" text-anchor="middle" font-weight="700">v3</text>
  <text x="560" y="300" font-family="Inter, sans-serif" font-size="11"
        fill="#E0F7FA" opacity="0.6" text-anchor="middle">deletion vectors</text>
  <text x="560" y="145" font-family="Inter, sans-serif" font-size="13"
        fill="#4DD0E1" text-anchor="middle">deletion vectors</text>
  <text x="560" y="165" font-family="Inter, sans-serif" font-size="13"
        fill="#4DD0E1" text-anchor="middle">+ row lineage</text>

  <text x="760" y="275" font-family="Inter, sans-serif" font-size="18"
        fill="#F87171" text-anchor="middle" font-weight="700">v4</text>
  <text x="760" y="300" font-family="Inter, sans-serif" font-size="11"
        fill="#F87171" opacity="0.9" text-anchor="middle">NOT production-ready</text>
  <text x="760" y="145" font-family="Inter, sans-serif" font-size="13"
        fill="#F87171" text-anchor="middle">groundwork only</text>

  <text x="450" y="360" font-family="Inter, sans-serif" font-size="13"
        fill="#E0F7FA" opacity="0.7" text-anchor="middle">
    Do not set format-version=4 on production tables
  </text>
</svg>