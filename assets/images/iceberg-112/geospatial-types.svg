<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="geoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
    <filter id="geoGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#geoBg)"/>

  <g stroke="#14B8A6" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <text x="400" y="50" font-family="Inter, sans-serif" font-size="24"
        font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Geospatial types · New in 1.12
  </text>

  <g transform="translate(240, 140)" filter="url(#geoGlow)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35"
             fill="none" stroke="#4DD0E1" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#4DD0E1"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#4DD0E1" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#4DD0E1" stroke-width="1.5" opacity="0.6"/>
  </g>
  <text x="240" y="260" font-family="Inter, sans-serif" font-size="20"
        font-weight="600" fill="#4DD0E1" text-anchor="middle">geometry</text>
  <text x="240" y="285" font-family="Inter, sans-serif" font-size="13"
        fill="#E0F7FA" opacity="0.7" text-anchor="middle">planar · WKB</text>

  <g transform="translate(560, 140)" filter="url(#geoGlow)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#14B8A6" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#14B8A6"
             stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="25" ry="70" fill="none" stroke="#14B8A6"
             stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#14B8A6"/>
  </g>
  <text x="560" y="260" font-family="Inter, sans-serif" font-size="20"
        font-weight="600" fill="#14B8A6" text-anchor="middle">geography</text>
  <text x="560" y="285" font-family="Inter, sans-serif" font-size="13"
        fill="#E0F7FA" opacity="0.7" text-anchor="middle">spherical · CRS84</text>

  <text x="400" y="400" font-family="Inter, sans-serif" font-size="14"
        fill="#FFFFFF" opacity="0.6" text-anchor="middle">
    Supported end-to-end in Spark 4.1 · Avro &amp; Parquet logical types
  </text>
</svg>