<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
  </defs>

  <rect width="900" height="400" fill="url(#bcBg)"/>
  <rect x="0" y="0" width="900" height="6" fill="#F59E0B"/>

  <g transform="translate(70, 110)">
    <polygon points="70,0 140,120 0,120" fill="none" stroke="#F59E0B"
             stroke-width="4" stroke-linejoin="round"/>
    <line x1="70" y1="40" x2="70" y2="80" stroke="#F59E0B"
          stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="100" r="4" fill="#F59E0B"/>
  </g>

  <text x="260" y="130" font-family="Inter, sans-serif" font-size="22"
        font-weight="700" fill="#FFFFFF">
    Breaking changes in 1.12.0
  </text>

  <g font-family="Inter, sans-serif" font-size="15" fill="#E0F7FA">
    <g transform="translate(260, 180)">
      <circle cx="10" cy="-5" r="10" fill="none" stroke="#F87171" stroke-width="2"/>
      <line x1="5" y1="-10" x2="15" y2="0" stroke="#F87171" stroke-width="2"/>
      <line x1="15" y1="-10" x2="5" y2="0" stroke="#F87171" stroke-width="2"/>
      <text x="35" y="0">Spark 3.4 support removed</text>
    </g>
    <g transform="translate(260, 220)">
      <circle cx="10" cy="-5" r="10" fill="none" stroke="#F87171" stroke-width="2"/>
      <line x1="5" y1="-10" x2="15" y2="0" stroke="#F87171" stroke-width="2"/>
      <line x1="15" y1="-10" x2="5" y2="0" stroke="#F87171" stroke-width="2"/>
      <text x="35" y="0">Position deletes with row data (PDWR)</text>
    </g>
    <g transform="translate(260, 260)">
      <circle cx="10" cy="-5" r="10" fill="none" stroke="#F87171" stroke-width="2"/>
      <line x1="5" y1="-10" x2="15" y2="0" stroke="#F87171" stroke-width="2"/>
      <line x1="15" y1="-10" x2="5" y2="0" stroke="#F87171" stroke-width="2"/>
      <text x="35" y="0">Old S3 signer classes &amp; deprecated SparkTableUtil</text>
    </g>
  </g>

  <text x="260" y="320" font-family="Inter, sans-serif" font-size="13"
