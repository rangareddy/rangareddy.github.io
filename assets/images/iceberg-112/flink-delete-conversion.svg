<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="fdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
    <filter id="fdGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#fdBg)"/>

  <text x="450" y="45" font-family="Inter, sans-serif" font-size="22"
        font-weight="700" fill="#FFFFFF" text-anchor="middle">
    ConvertEqualityDeletes · Flink maintenance task
  </text>

  <text x="225" y="100" font-family="Inter, sans-serif" font-size="16"
        font-weight="600" fill="#F87171" text-anchor="middle">
    Equality deletes
  </text>

  <g transform="translate(105, 130)" filter="url(#fdGlow)">
    <rect x="0" y="0" width="110" height="70" fill="#1B2A4E" stroke="#F87171"
          stroke-width="2" rx="6"/>
    <text x="55" y="30" font-family="Inter, sans-serif" font-size="12"
          fill="#F87171" text-anchor="middle">trip_id</text>
    <text x="55" y="48" font-family="Inter, sans-serif" font-size="11"
          fill="#E0F7FA" opacity="0.6" text-anchor="middle">= 'trip-1002'</text>

    <rect x="130" y="0" width="110" height="70" fill="#1B2A4E" stroke="#F87171"
          stroke-width="2" rx="6"/>
    <text x="185" y="30" font-family="Inter, sans-serif" font-size="12"
          fill="#F87171" text-anchor="middle">rider_id</text>
    <text x="185" y="48" font-family="Inter, sans-serif" font-size="11"
          fill="#E0F7FA" opacity="0.6" text-anchor="middle">= 'rider-8814'</text>
  </g>

  <text x="225" y="245" font-family="Inter, sans-serif" font-size="13"
        fill="#F87171" text-anchor="middle">
    Reader applies predicate widely
  </text>

  <g transform="translate(430, 195)">
    <path d="M0,0 L60,0" stroke="#4DD0E1" stroke-width="2.5" fill="none"/>
    <polygon points="60,-6 72,0 60,6" fill="#4DD0E1"/>
  </g>
  <text x="465" y="180" font-family="Inter, sans-serif" font-size="11"
        fill="#4DD0E1" text-anchor="middle">convert</text>

  <text x="675" y="100" font-family="Inter, sans-serif" font-size="16"
        font-weight="600" fill="#4DD0E1" text-anchor="middle">
    Deletion vectors
  </text>

  <g transform="translate(555, 130)" filter="url(#fdGlow)">
    <rect x="0" y="0" width="240" height="70" fill="#1B2A4E" stroke="#4DD0E1"
          stroke-width="2" rx="6"/>
    <g fill="#4DD0E1">
      <rect x="20" y="30" width="6" height="6"/>
      <rect x="40" y="30" width="6" height="6"/>
      <rect x="60" y="30" width="6" height="6"/>
      <rect x="80" y="30" width="6" height="6"/>
      <rect x="100" y="30" width="6" height="6"/>
      <rect x="140" y="30" width="6" height="6"/>
      <rect x="160" y="30" width="6" height="6"/>
      <rect x="180" y="30" width="6" height="6"/>
      <rect x="200" y="30" width="6" height="6"/>
    </g>
    <text x="120" y="55" font-family="Inter, sans-serif" font-size="11"
          fill="#E0F7FA" opacity="0.6" text-anchor="middle">Puffin bitmap</text>
  </g>

  <text x="675" y="245" font-family="Inter, sans-serif" font-size="13"
        fill="#4DD0E1" text-anchor="middle">
    Reader skips rows cheaply
  </text>

  <g transform="translate(105, 310)">
    <rect width="690" height="120" fill="#0A192F" stroke="#14B8A6"
          stroke-width="1" rx="6" opacity="0.6"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="13"
          font-weight="600" fill="#4DD0E1">How it works</text>
    <text x="20" y="55" font-family="Inter, sans-serif" font-size="12"
          fill="#E0F7FA" opacity="0.85">
      1. Flink IcebergSink writes data files + equality deletes to a staging branch
    </text>
    <text x="20" y="75" font-family="Inter, sans-serif" font-size="12"
          fill="#E0F7FA" opacity="0.85">
      2. ConvertEqualityDeletes resolves deletes and commits DVs to main
    </text>
    <text x="20" y="95" font-family="Inter, sans-serif" font-size="12"
          fill="#E0F7FA" opacity="0.85">
      3. Requires format v3 · RocksDB state · no concurrent writers on main
    </text>
  </g>
</svg>