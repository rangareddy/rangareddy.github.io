<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="hzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
    <filter id="hzGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#hzBg)"/>

  <text x="450" y="45" font-family="Inter, sans-serif" font-size="22"
        font-weight="700" fill="#FFFFFF" text-anchor="middle">
    rewrite_data_files · sort strategies
  </text>

  <text x="225" y="100" font-family="Inter, sans-serif" font-size="18"
        font-weight="600" fill="#FFFFFF" text-anchor="middle">Z-Order</text>
  <text x="675" y="100" font-family="Inter, sans-serif" font-size="18"
        font-weight="600" fill="#FFFFFF" text-anchor="middle">Hilbert</text>

  <g transform="translate(105, 130)">
    <rect width="240" height="240" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.4"/>
    <g stroke="#14B8A6" stroke-width="0.5" opacity="0.2">
      <line x1="80" y1="0" x2="80" y2="240"/>
      <line x1="160" y1="0" x2="160" y2="240"/>
      <line x1="0" y1="80" x2="240" y2="80"/>
      <line x1="0" y1="160" x2="240" y2="160"/>
    </g>
    <g fill="none" stroke="#4DD0E1" stroke-width="3" stroke-linecap="round"
       stroke-linejoin="round" filter="url(#hzGlow)">
      <path d="M20,20 L60,20 L60,60 L20,60 L20,100 L60,100 L60,140 L20,140 L20,180 L60,180 L60,220 L20,220"/>
      <path d="M100,20 L140,20 L140,60 L100,60 L100,100 L140,100 L140,140 L100,140 L100,180 L140,180 L140,220 L100,220"/>
      <path d="M180,20 L220,20 L220,60 L180,60 L180,100 L220,100 L220,140 L180,140 L180,180 L220,180 L220,220 L180,220"/>
    </g>
  </g>

  <g transform="translate(555, 130)">
    <rect width="240" height="240" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.4"/>
    <g stroke="#14B8A6" stroke-width="0.5" opacity="0.2">
      <line x1="80" y1="0" x2="80" y2="240"/>
      <line x1="160" y1="0" x2="160" y2="240"/>
      <line x1="0" y1="80" x2="240" y2="80"/>
      <line x1="0" y1="160" x2="240" y2="160"/>
    </g>
    <path d="M20,20 L20,60 L60,60 L60,20 L100,20 L100,60 L140,60 L140,20
             L180,20 L180,60 L220,60 L220,100 L180,100 L180,140 L220,140
             L220,180 L180,180 L180,220 L140,220 L140,180 L100,180 L100,220
             L60,220 L60,180 L20,180 L20,140 L60,140 L60,100 L20,100 Z"
          fill="none" stroke="#4DD0E1" stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" filter="url(#hzGlow)"/>
  </g>

  <text x="225" y="410" font-family="Inter, sans-serif" font-size="13"
        fill="#E0F7FA" opacity="0.7" text-anchor="middle">
    Angular zigzag · fast to compute
  </text>
  <text x="675" y="410" font-family="Inter, sans-serif" font-size="13"
        fill="#E0F7FA" opacity="0.7" text-anchor="middle">
    Smooth curve · tighter bounds
  </text>

  <text x="450" y="455" font-family="Inter, sans-serif" font-size="12"
        fill="#4DD0E1" opacity="0.8" text-anchor="middle">
    Cannot combine hilbert() and zorder() in one sort order
  </text>
</svg>