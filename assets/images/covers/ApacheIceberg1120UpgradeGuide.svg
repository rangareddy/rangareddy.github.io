<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
    <linearGradient id="iceTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A192F" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#heroBg)"/>

  <g opacity="0.08" stroke="#4DD0E1" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="80" y="200" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
    Apache Iceberg
  </text>
  <text x="80" y="290" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800" fill="#4DD0E1" letter-spacing="-2">
    1.12.0
  </text>

  <text x="80" y="360" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#E0F7FA" opacity="0.8">
    What's new, breaking changes &amp; upgrade guide
  </text>

  <rect x="80" y="400" width="60" height="4" fill="#14B8A6"/>
  <text x="80" y="450" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#4DD0E1" letter-spacing="2">
    APACHE ICEBERG · SPARK · FLINK · KAFKA CONNECT
  </text>

  <rect y="380" width="1200" height="250" fill="url(#waterGrad)"/>

  <g transform="translate(900, 120)" filter="url(#glow)">
    <polygon points="100,0 200,260 0,260" fill="url(#iceTop)" opacity="0.95"/>
    <polygon points="100,60 160,260 40,260" fill="#B2EBF2" opacity="0.6"/>
  </g>

  <g transform="translate(900, 380)" stroke="#4DD0E1" stroke-width="2.5"
     fill="#0A192F" opacity="0.95" filter="url(#glow)">
    <circle cx="100" cy="0" r="16"/>
    <circle cx="10" cy="60" r="12"/>
    <circle cx="190" cy="60" r="12"/>
    <circle cx="-50" cy="120" r="10"/>
    <circle cx="70" cy="130" r="10"/>
    <circle cx="130" cy="130" r="10"/>
    <circle cx="250" cy="120" r="10"/>

    <line x1="100" y1="16" x2="10" y2="48" stroke-width="2"/>
    <line x1="100" y1="16" x2="190" y2="48" stroke-width="2"/>
    <line x1="10" y1="72" x2="-50" y2="110" stroke-width="2"/>
    <line x1="10" y1="72" x2="70" y2="120" stroke-width="2"/>
    <line x1="190" y1="72" x2="130" y2="120" stroke-width="2"/>
    <line x1="190" y1="72" x2="250" y2="110" stroke-width="2"/>
  </g>
</svg>