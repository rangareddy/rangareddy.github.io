<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
<!-- hand-built Iceberg-series cover (light, hue 330); kept as is by make_covers.py -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF3F7"/><stop offset="55%" stop-color="#F5E0EB"/><stop offset="100%" stop-color="#E9C4D6"/></linearGradient>
<filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<polygon points="0,630 300,430 520,630" fill="#FFFFFF" opacity="0.35"/>
<polygon points="760,630 980,470 1200,600 1200,630" fill="#FFFFFF" opacity="0.3"/>

<g transform="translate(600,315) scale(0.93) translate(-600,-309)">
<rect x="48" y="58" width="112" height="38" rx="9" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5"/><image x="56" y="61" width="96" height="32" xlink:href="../logos/iceberg.png"/>
<text x="172" y="90" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#371024" letter-spacing="-1">ICEBERG ON POLARIS</text>
<rect x="174" y="99" width="200" height="4" rx="2" fill="#8E0B4D"/>
<text x="48" y="140" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">One compose file, two storage backends</text>
<rect x="48" y="175" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="48" y="189" width="6" height="96" rx="3" fill="#BD0F66"/>
<text x="68" y="207" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Who holds what</text>
<text x="68" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">Polaris holds the catalog,</text>
<text x="68" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">storage holds the data</text>
<text x="68" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#BD0F66">Architecture</text>
<rect x="428" y="175" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="428" y="189" width="6" height="96" rx="3" fill="#AA5C0E"/>
<text x="448" y="207" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Step 1: start the stack</text>
<text x="448" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">One compose file brings</text>
<text x="448" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">everything up</text>
<text x="448" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#AA5C0E">docker compose up</text>
<rect x="808" y="175" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="808" y="189" width="6" height="96" rx="3" fill="#457F0A"/>
<text x="828" y="207" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Step 2: catalogs and grants</text>
<text x="828" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">One provisioning script</text>
<text x="828" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">creates the catalogs</text>
<text x="828" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#457F0A">Permissions included</text>
<rect x="48" y="315" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="48" y="329" width="6" height="96" rx="3" fill="#0A7F45"/>
<text x="68" y="347" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Step 3: connect Spark</text>
<text x="68" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">One launch command with the</text>
<text x="68" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">REST catalog settings</text>
<text x="68" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0A7F45">Ready to query</text>
<rect x="428" y="315" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="428" y="329" width="6" height="96" rx="3" fill="#0F66BD"/>
<text x="448" y="347" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Step 4: use the table</text>
<text x="448" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">The same SQL on a local</text>
<text x="448" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">directory and on MinIO</text>
<text x="448" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F66BD">Both backends</text>
<rect x="808" y="315" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="808" y="329" width="6" height="96" rx="3" fill="#660FBD"/>
<text x="828" y="347" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Troubleshooting</text>
<text x="828" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">The failures you will meet</text>
<text x="828" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">and what causes them</text>
<text x="828" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#660FBD">Plus production notes</text>
<rect x="48" y="478" width="1104" height="76" rx="16" fill="#FFFFFF" stroke="#DBB3C7" stroke-width="1.5" filter="url(#shadow)"/>
<clipPath id="av"><circle cx="92" cy="516" r="28"/></clipPath><image x="64" y="488" width="56" height="56" clip-path="url(#av)" xlink:href="../logos/ranga-avatar-clear.png"/><circle cx="92" cy="516" r="28" fill="none" stroke="#BD0F66" stroke-width="2.5"/>
<text x="138" y="525" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B1B33">Ranga Reddy</text>
<text x="330" y="512" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#457F0A">linkedin.com/in/rangareddy1988</text>
<text x="330" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F66BD">rangareddy.github.io</text>
<text x="1136" y="525" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="end">Apache Iceberg series</text>
</g></svg>