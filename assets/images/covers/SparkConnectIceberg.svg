<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
<!-- hand-built Iceberg-series cover (deep, hue 285); kept as is by make_covers.py -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#551E67"/><stop offset="55%" stop-color="#3C1249"/><stop offset="100%" stop-color="#250A2E"/></linearGradient>
<filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<polygon points="0,630 300,430 520,630" fill="#FFFFFF" opacity="0.06"/>
<polygon points="760,630 980,470 1200,600 1200,630" fill="#FFFFFF" opacity="0.05"/>

<g transform="translate(600,315) scale(0.93) translate(-600,-309)">
<rect x="48" y="58" width="112" height="38" rx="9" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5"/><image x="56" y="61" width="96" height="32" xlink:href="../logos/iceberg.png"/>
<text x="172" y="90" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">ICEBERG ON SPARK CONNECT</text>
<rect x="174" y="99" width="200" height="4" rx="2" fill="#E2A1F7"/>
<text x="48" y="140" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#EDD6F5">The full surface, and the extension that breaks it</text>
<rect x="48" y="175" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="48" y="189" width="6" height="96" rx="3" fill="#910FBD"/>
<text x="68" y="207" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Where Iceberg must live</text>
<text x="68" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">On the server, not in the</text>
<text x="68" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">thin client</text>
<text x="68" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#910FBD">Architecture</text>
<rect x="428" y="175" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="428" y="189" width="6" height="96" rx="3" fill="#BD0F3B"/>
<text x="448" y="207" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Starting the server</text>
<text x="448" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">The jars and settings the</text>
<text x="448" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">server needs</text>
<text x="448" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#BD0F3B">Once, server side</text>
<rect x="808" y="175" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="808" y="189" width="6" height="96" rx="3" fill="#8E6D0B"/>
<text x="828" y="207" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">Connecting the client</text>
<text x="828" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">A client with no jars</text>
<text x="828" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">installed</text>
<text x="828" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#8E6D0B">pip install only</text>
<rect x="48" y="315" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="48" y="329" width="6" height="96" rx="3" fill="#287F0A"/>
<text x="68" y="347" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">The write and read surface</text>
<text x="68" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">MERGE, metadata tables,</text>
<text x="68" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">procedures and time travel</text>
<text x="68" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#287F0A">All of it works</text>
<rect x="428" y="315" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="428" y="329" width="6" height="96" rx="3" fill="#0A7F62"/>
<text x="448" y="347" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">The one thing that breaks</text>
<text x="448" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">Not Spark Connect: a second</text>
<text x="448" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">table format&#x27;s extension</text>
<text x="448" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0A7F62">Measured</text>
<rect x="808" y="315" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="808" y="329" width="6" height="96" rx="3" fill="#0F3BBD"/>
<text x="828" y="347" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1B33">What the thin client cannot do</text>
<text x="828" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">Limits to plan around</text>
<text x="828" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#334155">before you commit</text>
<text x="828" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F3BBD">Production notes</text>
<rect x="48" y="478" width="1104" height="76" rx="16" fill="#FFFFFF" stroke="#C294D1" stroke-width="1.5" filter="url(#shadow)"/>
<clipPath id="av"><circle cx="92" cy="516" r="28"/></clipPath><image x="64" y="488" width="56" height="56" clip-path="url(#av)" xlink:href="../logos/ranga-avatar-clear.png"/><circle cx="92" cy="516" r="28" fill="none" stroke="#910FBD" stroke-width="2.5"/>
<text x="138" y="525" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B1B33">Ranga Reddy</text>
<text x="330" y="512" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#8E6D0B">linkedin.com/in/rangareddy1988</text>
<text x="330" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0A7F62">rangareddy.github.io</text>
<text x="1136" y="525" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="end">Apache Iceberg series</text>
</g></svg>